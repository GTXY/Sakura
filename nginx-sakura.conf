# ============================================================
# Sakura Nginx 配置片段
# 将此内容合并到服务器已有的 server {} 块中
#
# 服务器目录结构：
#   /www/wwwroot/www.kudou-shinichi.cn/Sakura/frontend/dist/
# 后端运行在：127.0.0.1:8001
# ============================================================

    # ── API 反向代理（/Sakura/api/ → 后端 /api/）────────────
    location ^~ /Sakura/api/ {
        proxy_pass         http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
    }

    # ── 前端静态资源（优先级最高，直接命中，无需走 try_files）
    location ^~ /Sakura/assets/ {
        alias /www/wwwroot/www.kudou-shinichi.cn/Sakura/frontend/dist/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 前端 SPA（支持 Vue Router 刷新不 404）───────────────
    location ^~ /Sakura/ {
        alias /www/wwwroot/www.kudou-shinichi.cn/Sakura/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /Sakura/index.html;
    }
